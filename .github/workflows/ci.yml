name: Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pip==26.2.1 setuptools==84.0.0
      - run: python -m pip install --no-build-isolation --requirement .github/requirements-ci.txt
      - run: python -m pytest -q tests/test_standards.py tests/test_localization.py tests/test_repair.py tests/test_product_surface.py::test_installed_cli_and_ci_contract_are_executable

  portable-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2.1 setuptools==84.0.0
      - run: python -m pip install --no-build-isolation --requirement .github/requirements-ci.txt
      - name: Install pinned Godot runtime
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .tools/godot-4.7.1
          mv .tools/godot-4.7.1/Godot_v4.7.1-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          echo "32f8d7596c4b41185512b1c49d69f2da3be018fd784a53e349fa92a98a97bcde  .tools/godot" | sha256sum --check --status
      - name: Install pinned FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5
          ffmpeg -version | head -n 1 | grep --fixed-strings "ffmpeg version 6.1.1-3ubuntu5 "
      - run: GODOT_BINARY="$PWD/.tools/godot" python -m pytest -q -rs

  renderer-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2.1 setuptools==84.0.0
      - run: python -m pip install --no-build-isolation --requirement .github/requirements-ci.txt
      - name: Install pinned Godot runtime
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .tools/godot-4.7.1
          mv .tools/godot-4.7.1/Godot_v4.7.1-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          echo "32f8d7596c4b41185512b1c49d69f2da3be018fd784a53e349fa92a98a97bcde  .tools/godot" | sha256sum --check --status
      - run: GODOT_BINARY="$PWD/.tools/godot" pytest -q tests/test_product_surface.py::test_safety_demo_writes_all_terminal_receipts
      - run: GODOT_BINARY="$PWD/.tools/godot" flashpatch safety-demo --output artifacts/safety-demo
